[project]
name = "partial-observation-dmd"
version = "0.1.0"
description = "Code and reference results for: Recovering Hidden Neural Oscillatory Modes from Partial Observations through Delay Embedding and Perturbation"
readme = "README.md"
# Tested with Python 3.12; requirements-lock.txt pins the versions used for the paper.
requires-python = ">=3.11,<3.14"
dependencies = [
  "matplotlib>=3.8",
  "mne>=1.9",
  "networkx>=3.2",
  "nibabel>=5.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "pydmd>=2025.8.1",
  "scipy>=1.12",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
